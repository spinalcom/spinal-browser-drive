<md-toolbar class="md-theme-light">
  <section layout="row" layout-sm="row" layout-align="right center" layout-wrap
    style="height: 64px; flex-wrap: nowrap;">
    <img src="assets/imgs/logo_medium.png" alt="SpinalCom" style="height: 42px;padding: 4px 10px;" />
    <div flex></div>
    <div ng-if="connected" class="header-btn-container">
      <md-menu md-position-mode="target bottom">
        <md-button ng-click="$mdMenu.open($event)" class="header-layout-btn" aria-label="Open sample menu">
          <md-tooltip>
            Add layout
          </md-tooltip>
          <span>Add layout</span>
          <md-icon>library_add</md-icon>

        </md-button>
        <md-menu-content>
          <menu-glayout info="layouts"></menu-glayout>
          <md-menu-item ng-if="layouts.length == 0">
            No layout available
          </md-menu-item>
        </md-menu-content>
      </md-menu>

      <div class="header-separator"></div>
      <md-button class="header-user-btn" aria-label="btn.label" ng-click="clickUser()">
        <span>{{username}}</span>
        <md-tooltip>
          Open sidebar
        </md-tooltip>

        <md-icon class="header-user-btn-icon">person</md-icon>
      </md-button>
    </div>
  </section>
  </section>
</md-toolbar>
